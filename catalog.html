<!DOCTYPE html>
<html lang="uk">

    <head>
        <link rel="stylesheet" href="./index.css">
        <link rel="stylesheet" href="./catalog.css">
    </head>

    <body>

        <header class="header">
            <div class="logo">LuxStreet</div>

            <nav class="nav">
                <a href="./index.html">Головна</a>
                <a href="./catalog.html">Каталог</a>
                <a href="./index.html">Контакти</a>
            </nav>

            <div class="icons">
                <span>
                    <img class="chekuchka" src="./cart.png" alt="cart">
                    <b id="cartCount">0</b>
                </span>
            </div>
        </header>

        <section class="categories">
            <h2>Категорії</h2>

            <div class="grid">
                <button onclick="filterProducts('all')">Всі</button>
                <button onclick="filterProducts('women')">Жінкам</button>
                <button onclick="filterProducts('men')">Чоловікам</button>
                <button onclick="filterProducts('kids')">Дітям</button>
            </div>
        </section>

       <section class="products">
            <h2>Популярні товари</h2>

            <div class="grid" id="productsGrid"></div>
        </section>

        <footer>
            <p>© 2026 LUXSTREET</p>
        </footer>

        <script src="./catalog.js"></script>
    </body>
</html>
